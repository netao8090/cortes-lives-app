name: 9 - Diagnóstico chat Kick
on:
  workflow_dispatch:
    inputs:
      chatroom: {required: true}
      slug: {required: true}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q curl-cffi websocket-client
      - run: python scripts/diag_kick_chat.py "${{ inputs.chatroom }}" "${{ inputs.slug }}"
