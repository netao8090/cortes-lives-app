name: 9 - Teste YouTube
on:
  workflow_dispatch:
    inputs:
      url:
        required: false
        default: "https://www.youtube.com/watch?v=jNQXAC9IVRw"
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          curl -fsSL https://deno.land/install.sh | sh -s -- -y > /dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          docker run -d --name pot -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider > /dev/null || true
          yt-dlp --version
      - name: Testar combinações
        run: |
          sleep 5
          teste () {
            nome="$1"; shift
            out=$(timeout 120 yt-dlp -q --no-warnings "$@" -f "bv*[height<=1080]+ba/b" --download-sections "*0:00:02-0:00:08" --force-keyframes-at-cuts -o "t_$nome.%(ext)s" "$URL" 2>&1 | tail -2)
            if ls t_$nome.* >/dev/null 2>&1; then
              res=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 t_$nome.* | head -1)
              echo "RESULTADO $nome: OK (${res}p)"
            else
              echo "RESULTADO $nome: FALHOU | $(echo "$out" | tr '\n' ' ' | cut -c1-220)"
            fi
          }
          teste padrao
          teste tv --extractor-args "youtube:player_client=tv"
          teste mweb --extractor-args "youtube:player_client=mweb"
          teste tv_embedded --extractor-args "youtube:player_client=tv_embedded"
          teste web_embedded --extractor-args "youtube:player_client=web_embedded"
          teste ios --extractor-args "youtube:player_client=ios"
          teste android_vr --extractor-args "youtube:player_client=android_vr"
          teste pot_web --extractor-args "youtube:player_client=web;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
          teste pot_mweb --extractor-args "youtube:player_client=mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
          teste pot_tv --extractor-args "youtube:player_client=tv;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
