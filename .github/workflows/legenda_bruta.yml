name: 5 - Transcrever para legenda inteligente

# Transcreve palavra por palavra e separa quem fala; salva o rascunho em jobs/<job>/legendas/<id>.bruto.json
# para o Claude revisar antes de gravar a legenda no vídeo.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Nome do trabalho (pasta em jobs/)"
        required: true
      video:
        description: "release:<tag>/<arquivo> ou link direto; vários separados por vírgula como id=fonte"
        required: true
      opcoes:
        description: 'JSON opcional: {"lang":"pt","prompt":"yuri22, GTA","falantes":0,"limiar":0.6}'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ inputs.job }}
      VIDEO: ${{ inputs.video }}
      OPCOES: ${{ inputs.opcoes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper sherpa-onnx numpy
          mkdir -p models && cd models
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -sSL "$B/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" | tar xj
          curl -sSL -o nemo_en_titanet_small.onnx "$B/speaker-recongition-models/nemo_en_titanet_small.onnx"
          ls -la . sherpa-onnx-pyannote-segmentation-3-0

      - name: Transcrever e separar vozes
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          e = os.environ
          o = json.loads(e.get("OPCOES") or "{}")
          extra = []
          for k in ("lang", "prompt", "falantes", "limiar"):
              if k in o: extra += [f"--{k}", str(o[k])]
          itens = [x.strip() for x in e["VIDEO"].split(",") if x.strip()]
          os.makedirs("entrada", exist_ok=True)
          rc = 0
          for n, item in enumerate(itens, 1):
              cid, fonte = item.split("=", 1) if "=" in item and not item.startswith("release:") else (f"{n:02d}", item)
              if fonte.startswith("release:"):
                  tag, arq = fonte[8:].split("/", 1)
                  subprocess.run(["gh", "release", "download", tag, "-p", arq, "-D", "entrada", "--clobber"], check=True)
                  video = os.path.join("entrada", arq)
              else:
                  video = os.path.join("entrada", f"{cid}.mp4")
                  subprocess.run(["curl", "-sSL", "--fail", "-o", video, fonte], check=True)
              saida = f"jobs/{e['JOB']}/legendas/{cid}.bruto.json"
              rc = subprocess.run([sys.executable, "scripts/legenda_inteligente.py", "transcrever", video, saida] + extra).returncode or rc
          sys.exit(rc)
          EOF

      - name: Salvar rascunho
        run: |
          git config user.name robo-cortes
          git config user.email robo-cortes@users.noreply.github.com
          git add jobs/"$JOB"/legendas
          git commit -qm "legenda bruta: $JOB" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
