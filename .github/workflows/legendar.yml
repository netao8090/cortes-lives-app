name: 4 - Legendar vídeo

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Link do vídeo (YouTube, TikTok, Kick, link direto) ou release:<tag>/<arquivo>"
        required: true
      nome:
        description: "Nome do trabalho (vira a Release com o resultado)"
        required: true
      estilo:
        description: "viral, explosivo, gamer ou preset do pycaps"
        required: false
        default: "viral"
      destaques:
        description: "Palavras-chave separadas por vírgula"
        required: false
        default: ""
      emojis:
        description: 'JSON palavra→emoji, ex.: {"recorde":"😱"}'
        required: false
        default: ""
      opcoes:
        description: 'JSON opcional: {"posicao":0.68,"som":true,"lang":"pt","modelo":"turbo","preview":"3,9","prompt":"yuri22, GTA"}'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  legendar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO: ${{ inputs.video }}
      NOME: ${{ inputs.nome }}
      ESTILO: ${{ inputs.estilo }}
      DESTAQUES: ${{ inputs.destaques }}
      EMOJIS: ${{ inputs.emojis }}
      OPCOES: ${{ inputs.opcoes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modo
        id: modo
        run: |
          python -c "import json,os; o=json.loads(os.environ.get('OPCOES') or '{}'); print('bruto=' + ('1' if o.get('bruto') else '0')); print('teste=' + ('1' if o.get('teste_posicao') else '0'))" >> "$GITHUB_OUTPUT"

      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default,curl-cffi]"
          if [ "${{ steps.modo.outputs.teste }}" = "1" ]; then
            pip install -q opencv-python-headless numpy
          elif [ "${{ steps.modo.outputs.bruto }}" = "1" ]; then
            pip install -q faster-whisper sherpa-onnx numpy opencv-python-headless
            mkdir -p models && cd models
            B=https://github.com/k2-fsa/sherpa-onnx/releases/download
            curl -sSL "$B/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" | tar xj
            curl -sSL -o nemo_en_titanet_small.onnx "$B/speaker-recongition-models/nemo_en_titanet_small.onnx"
          else
            bash scripts/instalar_legendas.sh
          fi

      - name: Teste de posição numa imagem
        if: steps.modo.outputs.teste == '1'
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          o = json.loads(os.environ["OPCOES"])
          os.makedirs("saida", exist_ok=True)
          for f in o["teste_posicao"].split(","):
              nome = os.path.splitext(os.path.basename(f))[0]
              subprocess.run([sys.executable, "scripts/posicao_legenda.py", "imagem", f, "--topo-jogo", str(o.get("topo_jogo", 0.3)),
                              "--saida", f"saida/{nome}_posicao.jpg"], check=True)
          EOF
          gh release view "$NOME" > /dev/null 2>&1 || gh release create "$NOME" --title "Prévia: $NOME" --notes "Teste de posição da legenda."
          gh release upload "$NOME" saida/*_posicao.jpg --clobber

      - name: Baixar o vídeo
        if: steps.modo.outputs.teste != '1'
        run: |
          mkdir -p entrada saida/"$NOME"
          if [[ "$VIDEO" == release:* ]]; then
            ref="${VIDEO#release:}"; tag="${ref%%/*}"; arq="${ref#*/}"
            gh release download "$tag" -p "$arq" -D entrada --clobber
          elif [[ "$VIDEO" =~ \.(mp4|mov|mkv|webm)(\?|$) ]]; then
            curl -sSL --fail -o "entrada/video.${BASH_REMATCH[1]}" "$VIDEO"
          else
            yt-dlp -q --no-playlist -f "bv*[height<=1920]+ba/b" --merge-output-format mp4 -o "entrada/video.%(ext)s" "$VIDEO"
          fi
          ls -la entrada

      - name: Transcrever e separar vozes (rascunho para o Claude revisar)
        if: steps.modo.outputs.bruto == '1'
        run: |
          python - <<'EOF'
          import glob, json, os, subprocess, sys
          e = os.environ
          o = json.loads(e.get("OPCOES") or "{}")
          extra = []
          for k in ("lang", "prompt", "falantes", "limiar"):
              if k in o: extra += [f"--{k}", str(o[k])]
          if "topo_jogo" in o: extra += ["--topo-jogo", str(o["topo_jogo"])]
          cid = o.get("id", "01")
          f = sorted(glob.glob("entrada/*"))[0]
          saida = f"jobs/{e['NOME']}/legendas/{cid}.bruto.json"
          sys.exit(subprocess.run([sys.executable, "scripts/legenda_inteligente.py", "transcrever", f, saida] + extra).returncode)
          EOF
          git config user.name robo-cortes
          git config user.email robo-cortes@users.noreply.github.com
          git add jobs/"$NOME"/legendas
          git commit -qm "legenda bruta: $NOME" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done

      - name: Legendar
        if: steps.modo.outputs.bruto != '1' && steps.modo.outputs.teste != '1'
        run: |
          python - <<'EOF'
          import glob, json, os, subprocess, sys
          e = os.environ
          o = json.loads(e.get("OPCOES") or "{}")
          extra = []
          if "posicao" in o: extra += ["--posicao", str(o["posicao"])]
          if o.get("som"): extra += ["--som"]
          for k in ("lang", "modelo", "preview", "prompt", "palavras", "fonte", "compacta"):
              if o.get(k): extra += [f"--{k}", str(o[k])]
          if o.get("blocos"): extra += ["--blocos"]
          rc = 0
          for f in sorted(glob.glob("entrada/*")):
              base = os.path.splitext(os.path.basename(f))[0]
              cmd = [sys.executable, "scripts/legendar.py", f, f"saida/{e['NOME']}/{base}_legendado.mp4",
                     "--estilo", e["ESTILO"] or "viral", "--destaques", e.get("DESTAQUES", ""),
                     "--emojis", e.get("EMOJIS", "")] + extra
              rc = subprocess.run(cmd).returncode or rc
          sys.exit(rc)
          EOF

      - name: Publicar (Release)
        if: steps.modo.outputs.bruto != '1' && steps.modo.outputs.teste != '1'
        run: |
          if gh release view "$NOME" > /dev/null 2>&1; then
            gh release upload "$NOME" saida/"$NOME"/* --clobber
          else
            gh release create "$NOME" saida/"$NOME"/* --title "Legendas: $NOME" --notes "Vídeo legendado automaticamente (estilo $ESTILO)."
          fi
