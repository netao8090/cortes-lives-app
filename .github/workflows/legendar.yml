name: 4 - Legendar (legenda inteligente)

# Legenda gravada no vídeo: palavra por palavra, branco + amarelo na palavra dita, quem fala separado,
# posição que não cobre o personagem. Duas etapas com a revisão do Claude no meio (ver LEGENDAR.md):
#   rascunho → Claude revisa jobs/<job>/legendas/<id>.bruto.json e cria <id>.json → gravar
on:
  workflow_dispatch:
    inputs:
      etapa:
        description: "rascunho (transcreve + vozes + posição) | gravar (usa a revisão) | direto (sem revisão)"
        required: true
        default: "rascunho"
      job:
        description: "Nome do trabalho = nome da Release com os cortes (ou a criar, para vídeo avulso)"
        required: true
      video:
        description: "Opcional, vídeo avulso: link (YouTube, TikTok, Kick, .mp4) ou release:<tag>/<arquivo>"
        required: false
        default: ""
      so:
        description: "Opcional: só estes cortes (ex.: 01,03)"
        required: false
        default: ""
      estilo:
        description: "inteligente (aprovado) ou outro estilo do LEGENDAR.md"
        required: false
        default: "inteligente"
      opcoes:
        description: 'JSON opcional: {"lang":"pt","prompt":"nomes, gírias","topo_jogo":0.33,"falantes":2}'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: legendar-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  legendar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ETAPA: ${{ inputs.etapa }}
      JOB: ${{ inputs.job }}
      VIDEO: ${{ inputs.video }}
      SO: ${{ inputs.so }}
      ESTILO: ${{ inputs.estilo }}
      OPCOES: ${{ inputs.opcoes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default,curl-cffi]"
          if [ "$ETAPA" = "rascunho" ]; then
            pip install -q faster-whisper sherpa-onnx numpy opencv-python-headless
            mkdir -p models && cd models
            B=https://github.com/k2-fsa/sherpa-onnx/releases/download
            curl -sSL "$B/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" | tar xj
            curl -sSL -o nemo_en_titanet_small.onnx "$B/speaker-recongition-models/nemo_en_titanet_small.onnx"
            curl -sSL -o yolox.onnx "https://github.com/opencv/opencv_zoo/raw/main/models/object_detection_yolox/object_detection_yolox_2022nov.onnx"
          else
            bash scripts/instalar_legendas.sh
          fi

      - name: Legendar
        run: python scripts/legenda_job.py "$ETAPA" --job "$JOB" --so "$SO" --video "$VIDEO" --estilo "${ESTILO:-inteligente}" --opcoes "$OPCOES"

      - name: Salvar rascunho para a revisão
        if: always() && env.ETAPA == 'rascunho'
        run: |
          [ -d jobs/"$JOB"/legendas ] || exit 0
          git config user.name robo-cortes
          git config user.email robo-cortes@users.noreply.github.com
          git add jobs/"$JOB"/legendas
          git commit -qm "legenda (rascunho): $JOB" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
