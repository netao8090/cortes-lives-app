name: 3 - Postar cortes (TikTok + Instagram pelo Buffer)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Nome do trabalho (mesmo nome da Release). Vazio = só roda a reserva"
        required: false
        default: ""
      so:
        description: "Opcional: só estes ids (ex.: 01,03)"
        required: false
        default: ""
      teste:
        description: "sim = confere as contas com o 1º corte (vira rascunho no Buffer, nada publicado)"
        required: false
        default: "nao"
  schedule:
    # de hora em hora: empurra a reserva para o Buffer quando a fila de 10 abre vaga
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: postar-buffer
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB: ${{ inputs.job }}
      SO: ${{ inputs.so }}
      TESTE: ${{ inputs.teste }}
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - name: Configurado?
        id: cfg
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "AVISO_SEM_CHAVE postagem não configurada (falta o segredo BUFFER_API_KEY)"
            echo "pular=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.pular != '1'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.pular != '1'
        with:
          python-version: "3.12"

      - name: Preparar
        if: steps.cfg.outputs.pular != '1'
        run: |
          pip install -q requests
          git config --global user.name robo-cortes
          git config --global user.email robo-cortes@users.noreply.github.com
          cat > /tmp/midia.sh <<'EOF'
          # Mantém no branch "midia" só os vídeos que o Buffer ainda vai buscar (link público direto).
          set -e
          M=/tmp/midia; rm -rf $M; mkdir -p $M
          if git ls-remote --exit-code --heads origin midia >/dev/null; then
            git fetch -q --depth 1 origin midia && git archive FETCH_HEAD | tar -x -C $M
          fi
          ANTES=$(cd $M && find . -type f -name '*.mp4' | sort | md5sum)
          python scripts/postar.py --midia-necessaria --job "$1" > /tmp/precisa.txt
          N=/tmp/midia_nova; rm -rf $N; mkdir -p $N
          while read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "$N/$(dirname "$p")"
            if [ -f "saida/$p" ]; then cp "saida/$p" "$N/$p"; elif [ -f "$M/$p" ]; then mv "$M/$p" "$N/$p"; fi
          done < /tmp/precisa.txt
          DEPOIS=$(cd $N && find . -type f -name '*.mp4' | sort | md5sum)
          [ "$ANTES" = "$DEPOIS" ] && [ -z "$1" ] && { echo "mídia sem mudança"; exit 0; }
          cd $N && git init -q -b midia && git add -A && git commit -qm "mídia para postagem" --allow-empty \
            && git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" midia
          echo "mídia publicada: $(wc -l < /tmp/precisa.txt) vídeo(s)"
          EOF

      - name: Agendar o job
        if: steps.cfg.outputs.pular != '1' && env.JOB != ''
        run: |
          mkdir -p saida/"$JOB"
          gh release download "$JOB" -p 'corte_*_vertical.mp4' -D saida/"$JOB" --clobber
          bash /tmp/midia.sh "$JOB"
          sleep 20
          ARGS=(--job "$JOB" --so "$SO")
          [ "$TESTE" = "sim" ] && ARGS+=(--teste)
          python scripts/postar.py "${ARGS[@]}"

      - name: Reserva (abre vaga → manda pro Buffer) e limpeza da mídia
        if: steps.cfg.outputs.pular != '1' && env.JOB == ''
        run: |
          python scripts/postar.py --fila
          bash /tmp/midia.sh ""

      - name: Salvar a fila
        if: always() && steps.cfg.outputs.pular != '1'
        run: |
          [ -d estado ] || exit 0
          git add estado
          git commit -qm "postagem: ${JOB:-reserva}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
